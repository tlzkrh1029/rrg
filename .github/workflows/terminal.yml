name: terminal

# 아침 빌드(morning): 가격·구성종목·상장 목록 수집 → 계산 → 텔레그램 조건 알림(Claude 단계보다 먼저) → 돌파 지도 → Claude → 터미널 → 커밋.
#   화~금 08:05 KST 에 전날 종가로, 토 07:05 KST 에 금요일 종가로 돌고, 토요일에는 주간 브리핑도 보낸다.
# 저녁 실행(evening): 월~금 21:25 KST(미국 장전 시간)에 장후의 마지막 가격과 장전 가격만 받아(terminal/fetch_xh.py) 두 화면을 다시 만들고 커밋한 뒤
#   '밤사이' 텔레그램(크게 움직인 ETF·종목)을 보낸다.
# 시작: Claude 예약 작업 'rrg 빌드 시작'이 위 시각에 workflow_dispatch(mode)로 시작시킨다. GitHub 예약 실행(schedule)은 2~4시간 늦게
#   시작하곤 해서 예비로만 둔다. guard 작업이 늦게 시작한 예비 실행을 거른다(같은 날 빌드가 이미 있거나, 저녁인데 장전 시간이 아니면).
#   텔레그램은 같은 종가로 두 번 보내지 않는다(docs/data/sent.json, scripts/notify_telegram.py).
# 두 화면을 한 번에 만든다: 돌파 지도의 수집·계산(breakout/) → 터미널(terminal/ → docs/, 종목 상세에 그 계산을 끼움) → 돌파 지도 페이지(docs/breakout/).
# 돌파 지도 단계는 실패해도 터미널 빌드와 커밋을 막지 않는다(그날은 docs/breakout 이 직전 빌드로 남고, 터미널의 종목 상세는 직전 종목 가격을 쓴다).
# 터미널 계산과 페이지 생성 사이에서 Claude(구독 토큰 CLAUDE_SETUP_TOKEN)가 웹 검색으로 이유 문장·종목 요약과 킥의 원인을 쓴다. 이 단계들도 실패해도 빌드를 막지 않는다.
on:
  schedule:
    - cron: "10 23 * * 1-4"   # 아침 예비: 화~금 08:10 KST
    - cron: "5 22 * * 5"      # 아침 예비: 토 07:05 KST
    - cron: "5 9 * * 1-5"     # 저녁 예비: 월~금 18:05 KST. 2~4시간 늦어도 미국 장전 시간 안에 들도록 일찍 둔다(scripts/run_guard.py 의 EVENING_CRON)
  workflow_dispatch:
    inputs:
      mode:
        description: "morning(아침 빌드) · evening(저녁 장전 실행)"
        type: choice
        options: [morning, evening]
        default: morning
      digest:
        description: "주간 브리핑도 함께 보낸다(아침 빌드. 토요일에는 이 값과 상관없이 보낸다)"
        type: boolean
        default: false
      resend:
        description: "같은 종가로 이미 보낸 텔레그램도 다시 보낸다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.g.outputs.mode }}
      run: ${{ steps.g.outputs.run }}
      digest: ${{ steps.g.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_DIGEST: ${{ inputs.digest }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/run_guard.py

  build:
    needs: guard
    if: needs.guard.outputs.run == 'true' && needs.guard.outputs.mode == 'morning'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      SEND_DIGEST: ${{ needs.guard.outputs.digest }}
      TG_FORCE: ${{ inputs.resend == true && '--force' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 상장 목록: tradfi-ticker-lists 는 비공개 저장소라 LISTS_TOKEN(읽기 권한 PAT) 이 있을 때만 받는다.
      # 받지 못하거나 스크립트가 실패하면 이 저장소에 보관한 사본(data/lists)을 쓴다. 어느 경우에도 이 단계는 실패하지 않는다.
      - name: 상장 목록 (tradfi-ticker-lists)
        env:
          LISTS_TOKEN: ${{ secrets.LISTS_TOKEN }}
        run: |
          set +e
          LISTS_DIR="data/lists"
          if [ -n "$LISTS_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${LISTS_TOKEN}@github.com/tlzkrh1029/tradfi-ticker-lists" /tmp/lists
          else
            git clone --depth 1 https://github.com/tlzkrh1029/tradfi-ticker-lists /tmp/lists
          fi
          if [ -d /tmp/lists ]; then
            (cd /tmp/lists && python fetch_tradfi_tickers.py --out /tmp/lists/fresh)
            rc=$?
            if [ "$rc" = "0" ] || [ "$rc" = "2" ]; then
              echo "fresh lists (exit $rc)"
              cp /tmp/lists/fresh/binance_spot_bstocks.csv /tmp/lists/fresh/binance_futures_tradfi.csv /tmp/lists/fresh/hyperliquid_hip3_stocks.csv /tmp/lists/fresh/summary.json data/lists/
            elif [ -f /tmp/lists/output/summary.json ] && python -c "import json,sys; g=lambda p: json.load(open(p)).get('generated_at','') ; sys.exit(0 if g('/tmp/lists/output/summary.json') > g('data/lists/summary.json') else 1)"; then
              echo "::warning::list fetch failed (exit $rc); using the newer lists committed in tradfi-ticker-lists"
              cp /tmp/lists/output/binance_spot_bstocks.csv /tmp/lists/output/binance_futures_tradfi.csv /tmp/lists/output/hyperliquid_hip3_stocks.csv /tmp/lists/output/summary.json data/lists/
            else
              # 커밋된 목록이 이 저장소의 사본보다 새롭지 않으면 사본을 그대로 둔다(상장 점과 상장 로그가 예전 목록으로 돌아가지 않게)
              echo "::warning::list fetch failed (exit $rc); keeping data/lists (not older than the lists committed in tradfi-ticker-lists)"
            fi
          else
            echo "::warning::tradfi-ticker-lists could not be cloned (private repo without LISTS_TOKEN?); using data/lists kept in this repo"
          fi
          echo "LISTS_DIR=$LISTS_DIR" >> "$GITHUB_ENV"
          python -c "import json;print('lists as of', json.load(open('data/lists/summary.json'))['generated_at'])"
          exit 0

      # 상장 로그: 세 목록을 직전 상태와 비교해 신규·이탈을 data/lists/log.json 에 쌓는다(매트릭스의 5) 상장 로그 탭). 실패해도 다음 단계는 그대로 간다
      - name: 상장 로그 갱신
        run: |
          python terminal/listing_log.py || echo "::warning::listing log update failed; data/lists/log.json keeps its previous state"

      - name: 가격·구성종목 수집
        run: |
          set +e
          python fetch_prices.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then echo "::error::price fetch failed"; exit 1; fi
          if [ "$rc" = "2" ]; then echo "::warning::some holdings pages failed; see output/prices_summary.json"; fi

      # 조건 알림은 ETF 가격과 구성종목만으로 계산하므로 여기서 먼저 만들어 보낸다(Claude 단계를 기다리지 않는다).
      # --alerts-only 는 docs/data/alerts.txt·alerts.json 만 쓰고, 직전 빌드의 terminal-data.json 은 그대로 둔다(아래 전체 빌드가 같은 알림을 다시 계산한다).
      - name: 계산 (터미널 · 조건 알림)
        run: |
          python terminal/compute_terminal.py
          python terminal/build_terminal.py --lists "$LISTS_DIR" --alerts-only

      - name: 텔레그램 조건 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode alerts $TG_FORCE

      # ETF 차트: 매트릭스의 Holdings 패널과 돌파 지도의 ETF 패널이 함께 쓰는 90일 종가와 52주·사상 최고 수준(output/etf-chart-data.json).
      # 사상 최고는 ETF 마다 전체 이력(Yahoo range=max)을 월 1회 받아 둔 캐시(output/etf_ath.json)로 잡는다. 실패해도 다음 단계는 그대로 간다
      # (받지 못한 ETF 는 이전 캐시나 2년 가격 파일로 그리고, 파일 자체가 없으면 두 화면 모두 차트 없이 만든다).
      - name: ETF 차트 자료 (사상 최고 캐시)
        run: |
          set +e
          python fetch_etf_history.py
          rc=$?
          if [ "$rc" != "0" ]; then echo "::warning::ETF chart data incomplete (exit $rc); see output/etf_ath.json and this step's log"; fi
          exit 0

      # 돌파 지도: 28 ETF 의 상위 10개 구성종목(약 240 종목) 일봉을 Yahoo 에서 받는다. 처음 보는 종목은 전체 이력도 한 번 받는다(사상 최고 캐시).
      # 터미널보다 먼저 받고 계산하는 이유: 터미널의 종목 상세가 같은 날의 종목 가격(output/breakout-data.json)을 끼워 넣기 때문이다.
      - name: 구성종목 가격 수집 (돌파 지도)
        run: |
          set +e
          python breakout/fetch_stock_prices.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::warning::constituent price fetch failed; docs/breakout keeps the previous build and the terminal uses the previous stock prices"
            echo "BREAKOUT_OK=false" >> "$GITHUB_ENV"
          else
            echo "BREAKOUT_OK=true" >> "$GITHUB_ENV"
          fi
          if [ "$rc" = "2" ]; then echo "::warning::some constituent prices failed; see output/stocks/summary.json"; fi

      # 기여도 보조 자료: 최근 스냅샷에서 상위 10 밖으로 밀려난 종목(기간 시작 구성용)과 해외 종목 환율을 받는다.
      # 실패해도 다음 단계는 그대로 간다(그날 기여도는 받은 가격만으로 계산하고, 빠진 종목은 나머지에 들어간다).
      - name: 기여도 보조 가격·환율 수집
        run: |
          set +e
          python terminal/fetch_contrib_extras.py
          rc=$?
          if [ "$rc" != "0" ]; then echo "::warning::contribution extras incomplete (exit $rc); see output/stocks/extra_summary.json"; fi
          exit 0

      # 뉴스·실적: SEC EDGAR 8-K(Item 2.02) 실적 발표 시각과 최근 90일 공시(8-K 첫 문장 포함), Finnhub 최근 4주 헤드라인과 다가오는 실적일.
      # 약 4~6분 걸린다(Finnhub 분당 60건 한도, 기사가 많은 종목은 한 번 더 받는다. 8-K 본문은 처음 한 번 몰아서 받는다).
      # 비밀 값(SEC_USER_AGENT, FINNHUB_TOKEN)이 없거나 실패해도 다음 단계는 그대로 간다(실적은 이전 파일을 쓰고, 헤드라인은 그날 없이 만든다).
      - name: 뉴스·실적 수집
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set +e
          python terminal/fetch_news.py
          rc=$?
          if [ "$rc" != "0" ]; then echo "::warning::news fetch incomplete (exit $rc); see the meta of output/news/*.json"; fi
          exit 0

      - name: 계산 (돌파 지도)
        if: env.BREAKOUT_OK == 'true'
        run: |
          set +e
          python breakout/compute_breakout.py --lists "$LISTS_DIR"
          if [ "$?" != "0" ]; then echo "::warning::breakout computation failed; docs/breakout keeps the previous build"; echo "BREAKOUT_OK=false" >> "$GITHUB_ENV"; fi
          exit 0

      # 장후 가격: 터미널과 돌파 지도의 ETF·미국 상장 종목마다 마지막 정규장 종가 뒤의 장후 가격(output/xh.json).
      # 아침 빌드는 장후 거래(16:00~20:00 ET)가 이어지는 도중에 돌기 때문에 그때까지의 가격이다. 저녁 실행이 마지막 가격과 장전 가격으로 고친다.
      # 실패해도 다음 단계는 그대로 간다(그날 페이지는 장후·장전 없이 만든다).
      - name: 장후 가격 수집
        run: |
          set +e
          python terminal/fetch_xh.py
          rc=$?
          if [ "$rc" = "2" ]; then echo "::warning::some after-hours prices failed; see failed in output/xh.json"; fi
          if [ "$rc" = "1" ]; then echo "::warning::no after-hours prices; pages are built without them"; fi
          exit 0

      # 돌파 지도 페이지와 알림은 Claude 단계와 상관이 없으므로 먼저 만든다
      - name: 페이지 생성 (돌파 지도)
        if: env.BREAKOUT_OK == 'true'
        run: |
          set +e
          python breakout/build_breakout.py
          if [ "$?" != "0" ]; then echo "::warning::breakout map build failed; docs/breakout keeps the previous build"; fi
          exit 0

      # 돌파 지도의 알림 채널은 아직 정하지 않았다. 저장소 변수 BREAKOUT_TELEGRAM 을 true 로 두면 같은 봇으로
      # 조건 알림(새 돌파·새 이탈·블록 알림)과 토요일 주간 브리핑을 보낸다. 변수가 없으면 두 단계는 건너뛴다.
      - name: 텔레그램 돌파 지도 알림
        if: vars.BREAKOUT_TELEGRAM == 'true' && env.BREAKOUT_OK == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode alerts --docs docs/breakout $TG_FORCE

      # 터미널은 어떤 경우에도 만든다. 종목 상세는 output/breakout-data.json 이 있으면 그것을, 없으면 docs/breakout/data/ 의 직전 사본을 쓴다.
      # 킥(compute_kicks.py): 주마다 그 주를 결정한 하루를 종가로 정하고, 실적 공시·투자의견 제목으로 찾을 수 있는 원인은 규칙으로 붙인다.
      # 나머지 원인은 아래 'Claude 킥' 단계가 찾는다. 실패하면 페이지는 킥 없이 만든다.
      - name: 계산 (터미널)
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN != '' }}
          CLAUDE_NOTES: ${{ vars.CLAUDE_NOTES }}
          CLAUDE_KICKS: ${{ vars.CLAUDE_KICKS }}
        run: |
          python terminal/compute_contrib.py || echo "::warning::contribution computation failed; the Holdings panel is built without the contribution block"
          python terminal/compute_news.py || echo "::warning::news computation failed; the page is built without news and earnings"
          python terminal/compute_kicks.py || echo "::warning::kick computation failed; the page is built without kicks"

      # Claude 요약: Claude Code 가 웹 검색으로 (1) 최근 1개월 동안 기준보다 가장 많이 앞선 3개·뒤진 3개 ETF 의 이유 문장과
      # (2) 주도 종목(기여도 1개월·1주)의 최근 4주 요약을 쓴다. 종목은 실행마다 6개까지 돌아가며 맡아 대개 주 1회 새로 쓴다.
      # 인증은 구독 토큰(claude setup-token 으로 만든 값을 CLAUDE_SETUP_TOKEN 에 넣음)이고, 쓰는 양은 그 구독의 사용 한도에서 빠진다.
      # Claude 에게는 웹 검색·웹 페이지 읽기 두 도구만 준다(--tools). 저장소 파일을 읽거나 고치거나 명령을 실행할 수 없고,
      # 결과는 구조화된 출력(JSON)으로만 받는다. 다음 단계가 그 출력을 검사해 output/claude-notes.json 에 넣고, build_terminal.py 가 페이지에 싣는다.
      # 토큰이 없거나, 저장소 변수 CLAUDE_NOTES 가 off 이거나, 실패·시간 초과가 나도 빌드는 그대로 간다(그날은 이전 문장만 남는다).
      # 모델은 저장소 변수 CLAUDE_MODEL(기본 sonnet), 한 번에 맡길 종목 수는 CLAUDE_STOCKS(기본 6)로 바꿀 수 있다.
      # 킥의 원인은 따로 'Claude 킥' 단계가 맡는다(한쪽이 실패해도 다른 쪽은 반영된다). 한 번에 맡길 수는 저장소 변수 CLAUDE_KICKS
      # (없으면 평일 24, 주간 브리핑을 보내는 토요일 40, 최대 40, 0·off 면 끔)이고, 모델은 CLAUDE_KICKS_MODEL(없으면 CLAUDE_MODEL)이다.
      - name: Claude 요약·킥 준비
        id: cprep
        continue-on-error: true
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN != '' }}
          CLAUDE_NOTES: ${{ vars.CLAUDE_NOTES }}
          CLAUDE_STOCKS: ${{ vars.CLAUDE_STOCKS }}
          CLAUDE_KICKS: ${{ vars.CLAUDE_KICKS }}
        run: python terminal/claude_notes.py prep

      - name: Claude 요약 (웹 검색)
        id: claude
        if: steps.cprep.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.cprep.outputs.prompt }}
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'sonnet' }}
            --max-turns 80
            --tools WebSearch,WebFetch
            --allowedTools WebSearch,WebFetch
            --strict-mcp-config
            --setting-sources user
            --json-schema '{"type":"object","properties":{"etfs":{"type":"array","items":{"type":"object","properties":{"t":{"type":"string"},"text":{"type":"array","items":{"type":"string"}},"kick":{"type":"string"},"src":{"type":"array","items":{"type":"object","properties":{"t":{"type":"string"},"u":{"type":"string"}},"required":["t","u"]}}},"required":["t","text","src"]}},"stocks":{"type":"array","items":{"type":"object","properties":{"k":{"type":"string"},"text":{"type":"array","items":{"type":"string"}},"src":{"type":"array","items":{"type":"object","properties":{"t":{"type":"string"},"u":{"type":"string"}},"required":["t","u"]}}},"required":["k","text","src"]}},"skip":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"why":{"type":"string"}},"required":["id","why"]}}},"required":["etfs","stocks"]}'

      # 두 Claude 단계는 실행 기록을 같은 파일($RUNNER_TEMP/claude-execution-output.json)에 쓰므로, 요약 단계의 기록을 옮겨 둔다.
      # 반영 단계가 이 기록에서 웹 검색 횟수를 센다.
      - name: Claude 요약 실행 기록 보관
        if: steps.cprep.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/claude-execution-output.json" ]; then mv "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/claude-exec-notes.json"; fi

      # 킥: 그 주를 결정한 하루에 종목·ETF 가 왜 그렇게 움직였는지 한 구절과 근거 한 줄을 찾는다. 같은 도구 제한과 구조화된 출력을 쓴다.
      # 항목마다 웹 검색을 하게 하고, 찾지 못한 날은 skip 으로 받는다. 두 번 찾지 못하면 '이유 미확인'으로 남기고 다시 맡기지 않는다.
      # 맡긴 항목의 절반보다 적게 검색한 실행의 skip 은 남기지 않는다(다음 실행이 다시 찾는다).
      - name: Claude 킥 (웹 검색)
        id: kclaude
        if: steps.cprep.outputs.run_kicks == 'true'
        continue-on-error: true
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.cprep.outputs.prompt_kicks }}
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_KICKS_MODEL || vars.CLAUDE_MODEL || 'sonnet' }}
            --max-turns 200
            --tools WebSearch,WebFetch
            --allowedTools WebSearch,WebFetch
            --strict-mcp-config
            --setting-sources user
            --json-schema '{"type":"object","properties":{"kicks":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"kick":{"type":"string"},"ev":{"type":"string"},"src":{"type":"array","items":{"type":"object","properties":{"t":{"type":"string"},"u":{"type":"string"}},"required":["t","u"]}}},"required":["id","kick","ev","src"]}},"skip":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"why":{"type":"string"}},"required":["id","why"]}}},"required":["kicks"]}'

      - name: Claude 요약·킥 반영
        if: steps.cprep.outputs.run == 'true' || steps.cprep.outputs.run_kicks == 'true'
        continue-on-error: true
        env:
          CLAUDE_OUT: ${{ steps.claude.outputs.structured_output }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outcome }}
          KICKS_OUT: ${{ steps.kclaude.outputs.structured_output }}
          KICKS_CONCLUSION: ${{ steps.kclaude.outcome }}
          NOTES_EXEC: ${{ runner.temp }}/claude-exec-notes.json
          KICKS_EXEC: ${{ steps.kclaude.outputs.execution_file }}
        run: python terminal/claude_notes.py merge

      - name: 페이지 생성 (터미널)
        run: python terminal/build_terminal.py --lists "$LISTS_DIR"

      # 커밋 메시지 'terminal <종가 기준일>' 은 guard 가 늦게 시작한 예비 실행을 거를 때 찾는다.
      # 그사이 다른 커밋이 올라왔으면(병합 등) 그 위에 다시 얹어 한 번 더 민다.
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output docs data/lists
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "terminal $(python -c 'import json;print(json.load(open("output/terminal-data.json"))["asof"])')"
            git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
          fi

      - name: 텔레그램 주간 브리핑
        if: env.SEND_DIGEST == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode digest $TG_FORCE

      - name: 텔레그램 돌파 지도 주간 브리핑
        if: vars.BREAKOUT_TELEGRAM == 'true' && env.SEND_DIGEST == 'true' && env.BREAKOUT_OK == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode digest --docs docs/breakout $TG_FORCE

      # 텔레그램 단계가 docs/data/sent.json(같은 종가로 다시 보내지 않게 하는 기록)을 고쳤으면 한 번 더 커밋한다
      - name: 텔레그램 기록 커밋
        if: always()
        run: |
          for f in docs/data/sent.json docs/breakout/data/sent.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "no telegram record changes"
          else
            git commit -m "telegram record $(python -c 'import json;print(json.load(open("output/terminal-data.json"))["asof"])')"
            git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
          fi

  # 저녁 실행: 미국 장전 시간에 장후의 마지막 가격과 장전 가격을 받아(output/xh.json) 아침 빌드가 커밋한 자료로 두 화면을 다시 만든다.
  # 가격·뉴스·Claude 단계는 돌리지 않는다. 조건 알림은 아침 빌드가 찾은 것을 그대로 두고(같은 종가), 텔레그램은 '밤사이'만 보낸다.
  evening:
    needs: guard
    if: needs.guard.outputs.run == 'true' && needs.guard.outputs.mode == 'evening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 장후·장전 가격 수집
        id: xh
        run: |
          set +e
          python terminal/fetch_xh.py
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "::notice::New York regular session; nothing to do"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" = "1" ]; then echo "::error::no extended-hours prices"; exit 1; fi
          if [ "$rc" = "2" ]; then echo "::warning::some extended-hours prices failed; see failed in output/xh.json"; fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: 페이지 생성 (터미널)
        if: steps.xh.outputs.go == 'true'
        run: python terminal/build_terminal.py --lists data/lists

      - name: 페이지 생성 (돌파 지도)
        if: steps.xh.outputs.go == 'true'
        run: |
          set +e
          python breakout/build_breakout.py
          if [ "$?" != "0" ]; then echo "::warning::breakout map build failed; docs/breakout keeps the previous build"; fi
          exit 0

      # 커밋 메시지 'evening <종가 기준일>' 은 guard 가 늦게 시작한 저녁 예비 실행을 거를 때 찾는다
      - name: 커밋·푸시
        if: steps.xh.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "evening $(python -c 'import json;print(json.load(open("output/terminal-data.json"))["asof"])') pre-market"
            git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
          fi

      # '밤사이' 텔레그램(docs/data/night.txt): SPY·QQQ, 0.5% 넘게 움직인 ETF, 2% 넘게 움직였거나 실적을 낸 종목과 ETF 영향.
      # 페이지를 올린 뒤에 보내고, 같은 종가로는 한 번만 보낸다(docs/data/sent.json 의 night).
      - name: 텔레그램 밤사이
        if: steps.xh.outputs.go == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_FORCE: ${{ inputs.resend == true && '--force' || '' }}
        run: python scripts/notify_telegram.py --mode night $TG_FORCE

      - name: 텔레그램 기록 커밋
        if: steps.xh.outputs.go == 'true'
        run: |
          if [ -f docs/data/sent.json ]; then git add docs/data/sent.json; fi
          if git diff --cached --quiet; then
            echo "no telegram record changes"
          else
            git commit -m "telegram record $(python -c 'import json;print(json.load(open("output/terminal-data.json"))["asof"])') night"
            git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
          fi
