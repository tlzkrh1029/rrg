name: terminal

# 화~금 08:10 KST (월~목 23:10 UTC): 가격·구성종목·상장 목록 수집 → 계산 → docs/ 생성 → 커밋 → 변화가 있으면 텔레그램 조건 알림
# 토 07:05 KST (금 22:05 UTC): 금요일 종가로 같은 일을 하고, 이어서 주간 브리핑을 텔레그램으로 전송
# 두 화면을 한 번에 만든다: 돌파 지도의 수집·계산(breakout/) → 터미널(terminal/ → docs/, 종목 상세에 그 계산을 끼움) → 돌파 지도 페이지(docs/breakout/).
# 돌파 지도 단계는 실패해도 터미널 빌드와 커밋을 막지 않는다(그날은 docs/breakout 이 직전 빌드로 남고, 터미널의 종목 상세는 직전 종목 가격을 쓴다).
# 터미널 계산과 페이지 생성 사이에서 Claude(구독 토큰 CLAUDE_SETUP_TOKEN)가 웹 검색으로 이유 문장과 종목 요약을 쓴다. 이 단계도 실패해도 빌드를 막지 않는다.
on:
  schedule:
    - cron: "10 23 * * 1-4"
    - cron: "5 22 * * 5"
  workflow_dispatch:
    inputs:
      digest:
        description: "주간 브리핑도 함께 보낸다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: terminal
  cancel-in-progress: false

env:
  SEND_DIGEST: ${{ github.event.schedule == '5 22 * * 5' || inputs.digest == true }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 상장 목록: tradfi-ticker-lists 는 비공개 저장소라 LISTS_TOKEN(읽기 권한 PAT) 이 있을 때만 받는다.
      # 받지 못하거나 스크립트가 실패하면 이 저장소에 보관한 사본(data/lists)을 쓴다. 어느 경우에도 이 단계는 실패하지 않는다.
      - name: 상장 목록 (tradfi-ticker-lists)
        env:
          LISTS_TOKEN: ${{ secrets.LISTS_TOKEN }}
        run: |
          set +e
          LISTS_DIR="data/lists"
          if [ -n "$LISTS_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${LISTS_TOKEN}@github.com/tlzkrh1029/tradfi-ticker-lists" /tmp/lists
          else
            git clone --depth 1 https://github.com/tlzkrh1029/tradfi-ticker-lists /tmp/lists
          fi
          if [ -d /tmp/lists ]; then
            (cd /tmp/lists && python fetch_tradfi_tickers.py --out /tmp/lists/fresh)
            rc=$?
            if [ "$rc" = "0" ] || [ "$rc" = "2" ]; then
              echo "fresh lists (exit $rc)"
              cp /tmp/lists/fresh/binance_spot_bstocks.csv /tmp/lists/fresh/binance_futures_tradfi.csv /tmp/lists/fresh/hyperliquid_hip3_stocks.csv /tmp/lists/fresh/summary.json data/lists/
            elif [ -f /tmp/lists/output/summary.json ] && python -c "import json,sys; g=lambda p: json.load(open(p)).get('generated_at','') ; sys.exit(0 if g('/tmp/lists/output/summary.json') > g('data/lists/summary.json') else 1)"; then
              echo "::warning::list fetch failed (exit $rc); using the newer lists committed in tradfi-ticker-lists"
              cp /tmp/lists/output/binance_spot_bstocks.csv /tmp/lists/output/binance_futures_tradfi.csv /tmp/lists/output/hyperliquid_hip3_stocks.csv /tmp/lists/output/summary.json data/lists/
            else
              # 커밋된 목록이 이 저장소의 사본보다 새롭지 않으면 사본을 그대로 둔다(상장 점과 상장 로그가 예전 목록으로 돌아가지 않게)
              echo "::warning::list fetch failed (exit $rc); keeping data/lists (not older than the lists committed in tradfi-ticker-lists)"
            fi
          else
            echo "::warning::tradfi-ticker-lists could not be cloned (private repo without LISTS_TOKEN?); using data/lists kept in this repo"
          fi
          echo "LISTS_DIR=$LISTS_DIR" >> "$GITHUB_ENV"
          python -c "import json;print('lists as of', json.load(open('data/lists/summary.json'))['generated_at'])"
          exit 0

      # 상장 로그: 세 목록을 직전 상태와 비교해 신규·이탈을 data/lists/log.json 에 쌓는다(매트릭스의 5) 상장 로그 탭). 실패해도 다음 단계는 그대로 간다
      - name: 상장 로그 갱신
        run: |
          python terminal/listing_log.py || echo "::warning::listing log update failed; data/lists/log.json keeps its previous state"

      - name: 가격·구성종목 수집
        run: |
          set +e
          python fetch_prices.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then echo "::error::price fetch failed"; exit 1; fi
          if [ "$rc" = "2" ]; then echo "::warning::some holdings pages failed; see output/prices_summary.json"; fi

      # ETF 차트: 매트릭스의 Holdings 패널과 돌파 지도의 ETF 패널이 함께 쓰는 90일 종가와 52주·사상 최고 수준(output/etf-chart-data.json).
      # 사상 최고는 ETF 마다 전체 이력(Yahoo range=max)을 월 1회 받아 둔 캐시(output/etf_ath.json)로 잡는다. 실패해도 다음 단계는 그대로 간다
      # (받지 못한 ETF 는 이전 캐시나 2년 가격 파일로 그리고, 파일 자체가 없으면 두 화면 모두 차트 없이 만든다).
      - name: ETF 차트 자료 (사상 최고 캐시)
        run: |
          set +e
          python fetch_etf_history.py
          rc=$?
          if [ "$rc" != "0" ]; then echo "::warning::ETF chart data incomplete (exit $rc); see output/etf_ath.json and this step's log"; fi
          exit 0

      # 돌파 지도: 28 ETF 의 상위 10개 구성종목(약 240 종목) 일봉을 Yahoo 에서 받는다. 처음 보는 종목은 전체 이력도 한 번 받는다(사상 최고 캐시).
      # 터미널보다 먼저 받고 계산하는 이유: 터미널의 종목 상세가 같은 날의 종목 가격(output/breakout-data.json)을 끼워 넣기 때문이다.
      - name: 구성종목 가격 수집 (돌파 지도)
        run: |
          set +e
          python breakout/fetch_stock_prices.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::warning::constituent price fetch failed; docs/breakout keeps the previous build and the terminal uses the previous stock prices"
            echo "BREAKOUT_OK=false" >> "$GITHUB_ENV"
          else
            echo "BREAKOUT_OK=true" >> "$GITHUB_ENV"
          fi
          if [ "$rc" = "2" ]; then echo "::warning::some constituent prices failed; see output/stocks/summary.json"; fi

      # 기여도 보조 자료: 최근 스냅샷에서 상위 10 밖으로 밀려난 종목(기간 시작 구성용)과 해외 종목 환율을 받는다.
      # 실패해도 다음 단계는 그대로 간다(그날 기여도는 받은 가격만으로 계산하고, 빠진 종목은 나머지에 들어간다).
      - name: 기여도 보조 가격·환율 수집
        run: |
          set +e
          python terminal/fetch_contrib_extras.py
          rc=$?
          if [ "$rc" != "0" ]; then echo "::warning::contribution extras incomplete (exit $rc); see output/stocks/extra_summary.json"; fi
          exit 0

      # 뉴스·실적: SEC EDGAR 8-K(Item 2.02) 실적 발표 시각과 최근 90일 공시(8-K 첫 문장 포함), Finnhub 최근 4주 헤드라인과 다가오는 실적일.
      # 약 4~6분 걸린다(Finnhub 분당 60건 한도, 기사가 많은 종목은 한 번 더 받는다. 8-K 본문은 처음 한 번 몰아서 받는다).
      # 비밀 값(SEC_USER_AGENT, FINNHUB_TOKEN)이 없거나 실패해도 다음 단계는 그대로 간다(실적은 이전 파일을 쓰고, 헤드라인은 그날 없이 만든다).
      - name: 뉴스·실적 수집
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set +e
          python terminal/fetch_news.py
          rc=$?
          if [ "$rc" != "0" ]; then echo "::warning::news fetch incomplete (exit $rc); see the meta of output/news/*.json"; fi
          exit 0

      - name: 계산 (돌파 지도)
        if: env.BREAKOUT_OK == 'true'
        run: |
          set +e
          python breakout/compute_breakout.py --lists "$LISTS_DIR"
          if [ "$?" != "0" ]; then echo "::warning::breakout computation failed; docs/breakout keeps the previous build"; echo "BREAKOUT_OK=false" >> "$GITHUB_ENV"; fi
          exit 0

      # 터미널은 어떤 경우에도 만든다. 종목 상세는 output/breakout-data.json 이 있으면 그것을, 없으면 docs/breakout/data/ 의 직전 사본을 쓴다.
      - name: 계산 (터미널)
        run: |
          python terminal/compute_terminal.py
          python terminal/compute_contrib.py || echo "::warning::contribution computation failed; the Holdings panel is built without the contribution block"
          python terminal/compute_news.py || echo "::warning::news computation failed; the page is built without news and earnings"

      # Claude 요약: Claude Code 가 웹 검색으로 (1) 최근 1개월 동안 기준보다 가장 많이 앞선 3개·뒤진 3개 ETF 의 이유 문장과
      # (2) 주도 종목(기여도 1개월·1주)의 최근 4주 요약을 쓴다. 종목은 실행마다 6개까지 돌아가며 맡아 대개 주 1회 새로 쓴다.
      # 인증은 구독 토큰(claude setup-token 으로 만든 값을 CLAUDE_SETUP_TOKEN 에 넣음)이고, 쓰는 양은 그 구독의 사용 한도에서 빠진다.
      # Claude 에게는 웹 검색·웹 페이지 읽기 두 도구만 준다(--tools). 저장소 파일을 읽거나 고치거나 명령을 실행할 수 없고,
      # 결과는 구조화된 출력(JSON)으로만 받는다. 다음 단계가 그 출력을 검사해 output/claude-notes.json 에 넣고, build_terminal.py 가 페이지에 싣는다.
      # 토큰이 없거나, 저장소 변수 CLAUDE_NOTES 가 off 이거나, 실패·시간 초과가 나도 빌드는 그대로 간다(그날은 이전 문장만 남는다).
      # 모델은 저장소 변수 CLAUDE_MODEL(기본 sonnet), 한 번에 맡길 종목 수는 CLAUDE_STOCKS(기본 6)로 바꿀 수 있다.
      - name: Claude 요약 준비
        id: cprep
        continue-on-error: true
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN != '' }}
          CLAUDE_NOTES: ${{ vars.CLAUDE_NOTES }}
          CLAUDE_STOCKS: ${{ vars.CLAUDE_STOCKS }}
        run: python terminal/claude_notes.py prep

      - name: Claude 요약 (웹 검색)
        id: claude
        if: steps.cprep.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.cprep.outputs.prompt }}
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'sonnet' }}
            --max-turns 80
            --tools WebSearch,WebFetch
            --allowedTools WebSearch,WebFetch
            --strict-mcp-config
            --setting-sources user
            --json-schema '{"type":"object","properties":{"etfs":{"type":"array","items":{"type":"object","properties":{"t":{"type":"string"},"text":{"type":"array","items":{"type":"string"}},"src":{"type":"array","items":{"type":"object","properties":{"t":{"type":"string"},"u":{"type":"string"}},"required":["t","u"]}}},"required":["t","text","src"]}},"stocks":{"type":"array","items":{"type":"object","properties":{"k":{"type":"string"},"text":{"type":"array","items":{"type":"string"}},"src":{"type":"array","items":{"type":"object","properties":{"t":{"type":"string"},"u":{"type":"string"}},"required":["t","u"]}}},"required":["k","text","src"]}},"skip":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"why":{"type":"string"}},"required":["id","why"]}}},"required":["etfs","stocks"]}'

      - name: Claude 요약 반영
        if: steps.cprep.outputs.run == 'true'
        continue-on-error: true
        env:
          CLAUDE_OUT: ${{ steps.claude.outputs.structured_output }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outcome }}
        run: python terminal/claude_notes.py merge

      - name: 페이지 생성 (터미널)
        run: python terminal/build_terminal.py --lists "$LISTS_DIR"

      - name: 페이지 생성 (돌파 지도)
        if: env.BREAKOUT_OK == 'true'
        run: |
          set +e
          python breakout/build_breakout.py
          if [ "$?" != "0" ]; then echo "::warning::breakout map build failed; docs/breakout keeps the previous build"; fi
          exit 0

      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output docs data/lists
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "terminal $(python -c 'import json;print(json.load(open("output/terminal-data.json"))["asof"])')"
            git push
          fi

      - name: 텔레그램 조건 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode alerts

      - name: 텔레그램 주간 브리핑
        if: env.SEND_DIGEST == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode digest

      # 돌파 지도의 알림 채널은 아직 정하지 않았다. 저장소 변수 BREAKOUT_TELEGRAM 을 true 로 두면 같은 봇으로
      # 조건 알림(새 돌파·새 이탈·블록 알림)과 토요일 주간 브리핑을 보낸다. 변수가 없으면 두 단계는 건너뛴다.
      - name: 텔레그램 돌파 지도 알림
        if: vars.BREAKOUT_TELEGRAM == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode alerts --docs docs/breakout

      - name: 텔레그램 돌파 지도 주간 브리핑
        if: vars.BREAKOUT_TELEGRAM == 'true' && env.SEND_DIGEST == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --mode digest --docs docs/breakout
